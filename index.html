<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJCI · welcome</title>
  <style>
    /* minimalist dark background, soft modern look */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .card {
      max-width: 900px;
      //width: 100%;
      background: rgba(20, 26, 35, 0.8);
      backdrop-filter: blur(4px);
      border: 1px solid #2d3440;
      border-radius: 42px;
      padding: 3rem 2.8rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7);
      transition: 0.2s ease;
    }

    .card:hover {
      border-color: #3d4757;
      background: rgba(22, 29, 39, 0.9);
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0f3f8;
      line-height: 1.2;
      margin-bottom: 1.6rem;
      border-left: 6px solid #4c8dff;
      padding-left: 1.4rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .welcome-sub {
      font-size: 1.6rem;
      font-weight: 400;
      color: #cbd5e1;
      margin-bottom: 2.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.3rem 0.8rem;
    }

    .welcome-sub span {
      background: #1e2733;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-weight: 500;
      color: #d9e2ef;
      letter-spacing: 0.3px;
    }

    .link-row {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-top: 1.2rem;
    }

    .link-item {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.8rem 1rem;
      background: #131a24;
      padding: 1rem 1.6rem;
      border-radius: 60px;
      border: 1px solid #2b3544;
      transition: 0.2s;
    }

    .link-item:hover {
      background: #1a2330;
      border-color: #4a5b74;
    }

    .link-label {
      font-size: 1.5rem;
      font-weight: 500;
      color: #b7c3d4;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .link-label::after {
      content: "·";
      color: #4e6a8f;
      font-weight: bold;
      margin-left: 0.5rem;
      opacity: 0.7;
    }

    .link-value {
      font-size: 1.6rem;
      font-weight: 500;
      background: #0e141d;
      padding: 0.4rem 1.4rem;
      border-radius: 80px;
      border: 1px solid #2f3e52;
      transition: 0.15s;
      color: #9db4d6;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      word-break: break-all;
    }

    .link-value i {
      font-style: normal;
      font-size: 1.4rem;
      opacity: 0.9;
    }

    .link-value:hover {
      background: #182234;
      border-color: #4f7bc0;
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .link-value:active {
      transform: scale(0.98);
    }

    /* small icon / arrow */
    .link-value::before {
      content: "↗";
      font-size: 1.2rem;
      color: #6d8fc7;
      margin-right: 0.2rem;
    }

    /* special case for the booklet link (PDF) */
    .booklet-link::before {
      content: "📄";
      font-size: 1.3rem;
      margin-right: 0.3rem;
    }

    .website-link::before {
      content: "🌐";
      font-size: 1.3rem;
      margin-right: 0.3rem;
    }

    /* keep consistent spacing */
    .footer-note {
      margin-top: 2.4rem;
      color: #5a6b82;
      font-size: 0.9rem;
      text-align: right;
      border-top: 1px dashed #2f3c4e;
      padding-top: 1.2rem;
      opacity: 0.8;
      letter-spacing: 0.3px;
    }

    /* responsive adjustments */
    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 2.2rem;
        padding-left: 1rem;
      }
      .welcome-sub {
        font-size: 1.3rem;
      }
      .link-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
        border-radius: 28px;
      }
      .link-label::after {
        display: none;
      }
      .link-value {
        font-size: 1.3rem;
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 1.9rem;
      }
      .welcome-sub {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- main heading -->
    <h1>Welcome to the AJCI's website</h1>

    <!-- all link groups -->
    <div class="link-row">
      <!-- booklet.pdf link -->
      <div class="link-item">
        <span class="link-label">📁 Our welcome Booklet&nbsp;:</span>
        <!-- placeholder path – replace with actual booklet.pdf -->
        <a href="booklet.pdf" class="link-value booklet-link" download>booklet.pdf</a>
      </div>

      <!-- latest event + external website link -->
      <div class="link-item">
        <span class="link-label">📅 Our latest event&nbsp;:</span>
        <!-- external link – using example.com as a placeholder website -->
        <a href="https://icube.unistra.fr/actualites/les-olympiades-de-lajci-sport-echanges-et-cohesion-au-sein-dicube/" target="_blank" rel="noopener noreferrer" class="link-value website-link">
          Summer 2026 Olympiads
        </a>
      </div>
    </div>

    <!-- subtle footer for context (optional) -->
    <div class="footer-note">
      AJCI · association · discover more
    </div>
  </main>
</body>
</html>
